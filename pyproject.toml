[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenkit-trader"
version = "0.1.0"
description = "Validation-gated paper trading agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "httpx", "pyyaml"]

[project.scripts]
agenkit = "agenkit_trader.cli:main"

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy", "types-PyYAML", "pandas-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers"
markers = ["network: tests that need network access (deselected by default)"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
