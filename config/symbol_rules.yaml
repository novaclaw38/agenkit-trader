# Static per-symbol trading rules used by research (scripts/run_research.py
# --policy runtime) to round quantities and stop prices like the runtime.
# Fetched 2026-10-22 from the UNSIGNED public Binance Futures TESTNET endpoint
#   GET https://testnet.binancefuture.com/fapi/v1/exchangeInfo
# parsed exactly as BinanceTestnetVenue.symbol_rules does: tick =
# PRICE_FILTER.tickSize, lot = MARKET_LOT_SIZE.stepSize (else LOT_SIZE),
# min_notional = MIN_NOTIONAL.notional. The paper runtime re-reads the live
# values every cycle; these are a snapshot and can drift.
# BNB..LTC (round-2 universe) added from a second fetch of the same endpoint on
# 2026-10-22 (BTC/ETH re-checked: unchanged). Testnet filters can differ from
# mainnet ones; the runtime re-reads the venue's own values every cycle.
