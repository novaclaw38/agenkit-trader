# Live-trading gate (spec section 7). Edited by the human only: no code in this
# repository writes this file, and the agent/runtime has no way to change it.
# Live order placement is NOT implemented in this build: `agenkit live` only
# checks the unlock conditions. See docs/GOING_LIVE.md.
#
# enabled must stay false unless YOU decide to go live. It must be a YAML
# boolean (true/false); a quoted string is rejected.
enabled: false
# Minimum paper (testnet) record, measured from the decision log, before
# `agenkit live` accepts an unlock. PROPOSALS for the user to confirm.
min_paper_days: 14            # PROPOSED, user to confirm
min_paper_trades: 30          # PROPOSED, user to confirm
